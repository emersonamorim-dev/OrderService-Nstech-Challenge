name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OrderService.sln

      - name: Build
        run: dotnet build OrderService.sln --no-restore -c Release

      - name: Test
        run: dotnet test OrderService.sln --no-build -c Release --verbosity normal
